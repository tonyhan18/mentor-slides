<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1428A0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="url(#bg)" rx="12"/>
  
  <!-- Factory building -->
  <rect x="50" y="140" width="200" height="120" fill="#111827" stroke="#1d4ed8" stroke-width="1.5" rx="4"/>
  <rect x="50" y="120" width="30" height="20" fill="#111827" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="100" y="120" width="30" height="20" fill="#111827" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="150" y="120" width="30" height="20" fill="#111827" stroke="#1d4ed8" stroke-width="1.5"/>
  
  <!-- Factory windows (glowing) -->
  <rect x="65" y="160" width="20" height="20" fill="#1d4ed8" opacity="0.6" rx="2"/>
  <rect x="95" y="160" width="20" height="20" fill="#1d4ed8" opacity="0.4" rx="2"/>
  <rect x="125" y="160" width="20" height="20" fill="#1d4ed8" opacity="0.8" rx="2"/>
  <rect x="155" y="160" width="20" height="20" fill="#1d4ed8" opacity="0.3" rx="2"/>
  <rect x="185" y="160" width="20" height="20" fill="#1d4ed8" opacity="0.6" rx="2"/>
  <rect x="215" y="160" width="20" height="20" fill="#1d4ed8" opacity="0.5" rx="2"/>
  
  <rect x="65" y="200" width="20" height="20" fill="#1d4ed8" opacity="0.5" rx="2"/>
  <rect x="95" y="200" width="20" height="20" fill="#1d4ed8" opacity="0.7" rx="2"/>
  <rect x="125" y="200" width="20" height="20" fill="#1d4ed8" opacity="0.4" rx="2"/>
  <rect x="155" y="200" width="20" height="20" fill="#1d4ed8" opacity="0.6" rx="2"/>
  <rect x="185" y="200" width="20" height="20" fill="#1d4ed8" opacity="0.8" rx="2"/>
  <rect x="215" y="200" width="20" height="20" fill="#1d4ed8" opacity="0.3" rx="2"/>
  
  <!-- Factory door -->
  <rect x="120" y="220" width="40" height="40" fill="#0a0e1a" stroke="#1d4ed8" stroke-width="1" rx="2"/>
  
  <!-- "DARK FACTORY" label -->
  <text x="150" y="105" font-family="Arial" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold" letter-spacing="2">DARK FACTORY</text>
  
  <!-- Connection lines to AI Agent -->
  <line x1="250" y1="200" x2="350" y2="200" stroke="url(#line)" stroke-width="2"/>
  <circle cx="300" cy="200" r="4" fill="#1d4ed8"/>
  <text x="300" y="190" font-family="Arial" font-size="9" fill="#8892b0" text-anchor="middle">Workflow</text>
  
  <!-- AI Agent node -->
  <rect x="350" y="140" width="200" height="120" fill="#111827" stroke="#f5a623" stroke-width="1.5" rx="8"/>
  <text x="450" y="170" font-family="Arial" font-size="14" fill="#f5a623" text-anchor="middle" font-weight="bold">AI Agent</text>
  
  <!-- Agent inner nodes -->
  <circle cx="390" cy="200" r="12" fill="#1d4ed8" opacity="0.6"/>
  <text x="390" y="204" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle">NLP</text>
  
  <circle cx="430" cy="210" r="12" fill="#1d4ed8" opacity="0.5"/>
  <text x="430" y="214" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle">CV</text>
  
  <circle cx="470" cy="200" r="12" fill="#1d4ed8" opacity="0.7"/>
  <text x="470" y="204" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle">ML</text>
  
  <circle cx="510" cy="210" r="12" fill="#f5a623" opacity="0.5"/>
  <text x="510" y="214" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle">API</text>
  
  <!-- Agent connections -->
  <line x1="402" y1="200" x2="418" y2="210" stroke="#1d4ed8" stroke-width="1" opacity="0.4"/>
  <line x1="442" y1="210" x2="458" y2="200" stroke="#1d4ed8" stroke-width="1" opacity="0.4"/>
  <line x1="482" y1="200" x2="498" y2="210" stroke="#f5a623" stroke-width="1" opacity="0.4"/>
  
  <!-- Bottom text -->
  <text x="450" y="245" font-family="Arial" font-size="10" fill="#8892b0" text-anchor="middle">System Integration</text>
  
  <!-- Top labels -->
  <text x="150" y="280" font-family="Arial" font-size="11" fill="#8892b0" text-anchor="middle">무인 자동화 공장</text>
  <text x="450" y="280" font-family="Arial" font-size="11" fill="#8892b0" text-anchor="middle">AI 에이전트 통합</text>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="bold">🏭 Dark Factory → AI Agent 통합 개발</text>
  <text x="300" y="50" font-family="Arial" font-size="11" fill="#8892b0" text-anchor="middle">사내 시스템 통합 Workflow + AI Agent 통합</text>
</svg>
